server {
    listen 80;
    server_name localhost;
    root /usr/share/nginx/html;
    index index.html;

    # Gzip
    gzip on;
    gzip_vary on;
    gzip_types text/plain text/css application/json application/javascript text/xml application/xml application/xml+rss text/javascript;

    # El index.html NUNCA se cachea: es el único archivo sin hash en el nombre y
    # el que apunta a los bundles nuevos. Cacheado, la profesora sigue ejecutando
    # la versión anterior de la app después de un despliegue —ocurrió el
    # 2026-08-12: la resolución de imágenes ya existía en el servidor y su
    # navegador corría el código viejo, que no la llamaba.
    location = /index.html {
        expires -1;
        add_header Cache-Control "no-cache, must-revalidate";
    }

    # Los assets sí se cachean, porque llevan hash en el nombre: un cambio genera
    # otro archivo y el index.html nuevo apunta a él.
    # Cache static assets
    location ~* \.(js|css|png|jpg|jpeg|gif|ico|svg|woff|woff2|ttf|eot)$ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    # Aumentar límite para documentos grandes generados por IA
    client_max_body_size 20m;

    # API proxy
    location /api/ {
        proxy_pass http://backend:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_buffering off;
        proxy_read_timeout 300s;
        proxy_send_timeout 300s;
    }

    # Imágenes generadas por IA (archivos estáticos del backend)
    # ^~ tiene mayor prioridad que los location regex (~*) de arriba
    location ^~ /static/ {
        proxy_pass http://backend:8000/static/;
        proxy_buffering off;
    }

    # SPA fallback
    location / {
        try_files $uri $uri/ /index.html;
    }
}
